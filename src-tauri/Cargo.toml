[package]
name = "opx"
version = "0.1.0"
description = "Lightweight cross-platform operations management tool"
authors = ["opx-dev"]
license = ""
repository = ""
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = [ "tray-icon", "shell-open"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sys-info = "0.14"
tokio = { version = "1.0", features = ["full"] }
reqwest = { version = "0.11", features = ["blocking", "json"] }
zip = "0.6"
tar = "0.4"
flate2 = "1.0"
walkdir = "2.0"
chrono = "0.4"
anyhow = "1.0"
thiserror = "1.0"
path-slash = "0.1"
windows-service = { version = "0.6", optional = true }

[target.'cfg(windows)'.dependencies]
windows-service = "0.6"
winapi = { version = "0.3", features = ["winbase", "winnt", "handleapi"] }

[features]
default = []
service = ["windows-service"]

[workspace]