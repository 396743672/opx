[package]
name = "opx"
version = "0.4.0"
description = "Lightweight cross-platform operations management tool"
authors = ["opx-dev"]
license = "MIT"
repository = "https://github.com/opx-dev/opx"
edition = "2021"

[lib]
name = "opx_lib"
path = "src/lib.rs"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.31.0"
tokio = { version = "1.0", features = ["rt-multi-thread", "macros", "net", "time"] }
reqwest = { version = "0.13", features = ["blocking", "json", "stream"] }
zip = { version = "0.6", default-features = false, features = ["deflate", "bzip2", "time"] }
tar = "0.4"
flate2 = "1.0"
walkdir = "2.0"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1.0"
winreg = "0.52"
once_cell = "1.19"
uuid = { version = "1.0", features = ["v4"] }
sha2 = "0.10"
futures = "0.3"
regex = "1.10"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
encoding_rs = "0.8"
rcgen = { version = "0.13", features = ["pem"] }
notify = "6"
instant-acme = "0.8"
hmac = "0.12"
base64 = "0.23.1"
lettre = { version = "0.11.23", features = ["aws-lc-rs", "builder", "hostname", "pool", "smtp-transport", "tokio1", "tokio1-rustls", "webpki-roots"], default-features = false }

